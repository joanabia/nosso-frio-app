<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NOSSO FRIO | Mossoró - RN</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--azul:#0f2f3e;--amarelo:#f5c518;--verde:#16a34a;--cinza:#64748b;--fundo:#f3f6f8;--borda:#e2e8f0}
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}
body{background:var(--fundo)}
.header{background:var(--azul);color:#fff;padding:14px;display:flex;justify-content:space-between;border-bottom:3px solid var(--amarelo)}
.logo{display:flex;gap:10px;align-items:center}
.logo-icon{background:var(--amarelo);color:var(--azul);width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:22px}
.badge{background:var(--amarelo);color:var(--azul);border-radius:20px;padding:6px 10px;font-weight:bold;font-size:10px}
#map{width:100%;height:250px;background:#dce5e9}
.page{max-width:760px;margin:auto;padding:18px 13px 110px}
.section-title{color:var(--azul);font-size:20px;font-weight:900}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:12px}
.card{position:relative;background:#fff;border:2px solid var(--borda);border-radius:14px;padding:16px 8px;text-align:center;cursor:pointer}
.card.selected{background:var(--azul);color:#fff}
.tag{position:absolute;top:6px;right:6px;font-size:8px;font-weight:900;padding:4px 6px;border-radius:20px}
.def{background:#fee2e2;color:#991b1b}.ser{background:#dcfce7;color:#166534}
.cta,.secondary{display:block;width:100%;margin-top:12px;padding:14px;border-radius:12px;font-weight:800;cursor:pointer;text-align:center;border:0}
.cta{background:var(--azul);color:var(--amarelo)}.cta:disabled{opacity:0.5}
.secondary{background:var(--azul);color:#fff}.whatsapp{background:var(--verde)}
.panel{display:none}.panel.active{display:block}
.panel-card{background:#fff;border:1px solid var(--borda);border-radius:14px;padding:16px;margin-bottom:12px}
.field{display:block;margin-top:12px;font-size:13px;font-weight:bold;color:var(--azul)}
.field input,.field select,.field textarea{width:100%;margin-top:6px;padding:11px;border:1px solid #cbd5e1;border-radius:9px}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sec-title{font-size:11px;font-weight:900;background:#f1f5f9;padding:8px;border-radius:8px;margin:12px 0 8px}
.tabs{position:fixed;bottom:0;left:0;right:0;display:flex;background:#fff;border-top:1px solid var(--borda);padding:8px 0;z-index:999}
.tab{flex:1;background:none;border:0;color:#64748b;font-size:10px;text-align:center}
.tab.active{color:var(--azul);font-weight:900}.tab span{display:block;font-size:18px}
table{width:100%;border-collapse:collapse;font-size:12px}
th{font-size:10px;color:#64748b;text-align:left;padding:8px;background:#f8fafc}
td{padding:8px;border-bottom:1px solid #e2e8f0;vertical-align:top}
.pill{font-size:10px;font-weight:900;padding:3px 7px;border-radius:20px}
.p-pend{background:#fef3c7;color:#92400e}.p-rota{background:#dbeafe;color:#1e40af}.p-fim{background:#dcfce7;color:#166534}
.btn-excel{background:#107c41;color:#fff;border:0;padding:10px 14px;border-radius:8px;font-weight:800;cursor:pointer}
.btn-limpar{background:#fff;color:#991b1b;border:1px solid #fecaca;padding:10px 14px;border-radius:8px;font-weight:800;cursor:pointer}
</style>
</head>
<body>

<header class="header">
  <div class="logo"><div class="logo-icon">❄</div><div><h1>NOSSO FRIO</h1><span style="font-size:10px">MOSSORÓ - RN</span></div></div>
  <div class="badge">MOSSORÓ - RN</div>
</header>

<div id="map"></div>

<main class="page">

<section id="inicio" class="panel active">
  <h2 class="section-title">Qual é o problema do seu ar?</h2>
  <div class="grid" id="grid"></div>
  <button class="cta" id="cta" onclick="chamar()" disabled style="margin-top:12px">SELECIONE UM SERVIÇO</button>
</section>

<section id="agendar" class="panel">
  <h2 class="section-title">📅 Agendamento</h2>
  <div class="panel-card">
    <form id="formAgendamento">
      <label class="field">Nome<input id="nome" required></label>
      <label class="field">Telefone<input id="telefone" required></label>
      <label class="field">Empresa (opcional)<input id="empresa"></label>
      <label class="field">Serviço<select id="servico" required><option value="">Selecione</option><option>Instalação</option><option>Limpeza</option><option>Manutenção</option><option>Não gela</option><option>Outro</option></select></label>
      <label class="field">Data<input id="data" type="date" required></label>
      <label class="field">Endereço<input id="endereco" required></label>
      <button class="secondary whatsapp" type="submit">Enviar pelo WhatsApp</button>
    </form>
  </div>
</section>

<section id="rastreio" class="panel">
  <h2 class="section-title">📍 Acompanhar</h2>
  <div class="panel-card">
    <p id="rastreioStatus">Aguardando técnico...</p>
    <p style="font-size:11px" id="rastreioEndereco"></p>
  </div>
</section>

<section id="painel-tecnico" class="panel">
  <h2 class="section-title">👷 Painel do Técnico</h2>
  <div class="panel-card">
    <label class="field">Nome<input id="tecNome"></label>
    <label class="field">Empresa<input id="tecEmpresa"></label>
    <label class="field">Telefone<input id="tecTelefone"></label>
    <div class="sec-title">ENDEREÇO COMPLETO</div>
    <div class="field-row">
      <label class="field">CEP<input id="tecCep" placeholder="59600-000" onblur="buscarCep()"></label>
      <label class="field">Número<input id="tecNumero"></label>
    </div>
    <label class="field">Rua<input id="tecRua"></label>
    <div class="field-row">
      <label class="field">Bairro<input id="tecBairro"></label>
      <label class="field">Cidade<input id="tecCidade" value="Mossoró"></label>
    </div>
    <label class="field">Serviço<select id="tecServico"><option>Instalação</option><option>Limpeza</option><option>Manutenção</option><option>Não gela</option><option>Gotejando</option><option>Barulho</option><option>Não liga</option></select></label>
    <label class="field">Valor<input id="tecValor" type="number"></label>
    <label class="field">O que foi feito<textarea id="tecFeito"></textarea></label>
    <button class="secondary" style="background:#16a34a" onclick="cadastrarTecnico()">💾 CADASTRAR NO ADMIN</button>
  </div>
</section>

<section id="admin" class="panel">
  <h2 class="section-title">🔒 Admin - Senha 1234</h2>
  <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:12px 0">
    <div style="background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:12px"><p style="font-size:10px">TOTAL</p><b id="kpi-total">0</b></div>
    <div style="background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:12px"><p style="font-size:10px">PENDENTES</p><b id="kpi-pend">0</b></div>
    <div style="background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:12px"><p style="font-size:10px">EM ROTA</p><b id="kpi-rota">0</b></div>
    <div style="background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:12px"><p style="font-size:10px">FATURADO</p><b id="kpi-fat">R$ 0</b></div>
  </div>
  <div class="panel-card" style="display:flex;gap:8px">
    <button class="btn-excel" onclick="exportarCSV()">📊 Excel</button>
    <button class="btn-limpar" onclick="limparAntigos()">🗑 Limpar</button>
  </div>
  <div class="panel-card" style="padding:0;overflow:auto">
    <table><thead><tr><th>Data</th><th>Cliente / Endereço</th><th>Serviço</th><th>Status</th><th>Valor</th></tr></thead><tbody id="tbodyAdmin"></tbody></table>
  </div>
</section>

</main>

<nav class="tabs">
  <button class="tab active" data-tab="inicio"><span>⌂</span>Início</button>
  <button class="tab" data-tab="agendar"><span>📅</span>Agendar</button>
  <button class="tab" data-tab="rastreio"><span>📍</span>Rastreio</button>
  <button class="tab" data-tab="painel-tecnico"><span>👷</span>Técnico</button>
  <button class="tab" data-tab="admin"><span>🔒</span>Admin</button>
</nav>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const WHATSAPP="5584998407706";
const SENHA="1234";
const defeitos=[{t:"Não gela",s:"Não gela",i:"❄",k:"DEFEITO"},{t:"Gotejando",s:"Vazando",i:"💧",k:"DEFEITO"},{t:"Barulho",s:"Barulho",i:"🔊",k:"DEFEITO"},{t:"Não liga",s:"Não liga",i:"⏻",k:"DEFEITO"},{t:"Limpeza",s:"Limpeza",i:"✨",k:"SERVIÇO"},{t:"Instalação",s:"Instalação",i:"🔧",k:"SERVIÇO"},{t:"Manutenção",s:"Manutenção",i:"🛠",k:"SERVIÇO"}];
let selecionado=null;

function getAtend(){try{return JSON.parse(localStorage.getItem("nf_atend")||"[]")}catch(e){return[]}}
function saveAtend(l){localStorage.setItem("nf_atend",JSON.stringify(l))}

function renderAdmin(){
  let dados=getAtend();
  document.getElementById("kpi-total").innerText=dados.length;
  document.getElementById("kpi-pend").innerText=dados.filter(a=>a.status==="pendente").length;
  document.getElementById("kpi-rota").innerText=dados.filter(a=>a.status==="em_rota").length;
  document.getElementById("kpi-fat").innerText="R$ "+dados.filter(a=>a.status==="finalizado").reduce((s,a)=>s+(Number(a.valor)||0),0);
  document.getElementById("tbodyAdmin").innerHTML=dados.map(a=>`
    <tr>
      <td>${a.data||""}<br><span style="font-size:9px">${a.id||""}</span></td>
      <td><b>${a.nome||""}</b><br>${a.telefone||""} ${a.empresa||""}<br><span style="font-size:11px">${a.enderecoCompleto||a.endereco||""}</span><br><span style="font-size:10px;background:#f1f5f9;padding:2px 6px;border-radius:4px">CEP ${a.cep||"-"} Nº ${a.numero||""} ${a.bairro||""}</span></td>
      <td>${a.servico||""}</td>
      <td>${a.status||""}</td>
      <td>${a.valor?"R$ "+a.valor:"-"}</td>
    </tr>`).join("")||`<tr><td colspan="5" style="text-align:center;padding:20px">Nenhum</td></tr>`;
}

function buscarCep(){
  let cep=document.getElementById("tecCep").value.replace(/\D/g,'');
  if(cep.length!==8)return;
  fetch(`https://viacep.com.br/ws/${cep}/json/`).then(r=>r.json()).then(d=>{
    if(!d.erro){
      document.getElementById("tecRua").value=d.logradouro;
      document.getElementById("tecBairro").value=d.bairro;
      document.getElementById("tecCidade").value=d.localidade;
    }
  });
}

function criarCartoes(){
  let grid=document.getElementById("grid");
  grid.innerHTML="";
  defeitos.forEach(s=>{
    let c=document.createElement("button");
    c.className="card";
    c.innerHTML=`<span class="tag ${s.k==="SERVIÇO"?"ser":"def"}">${s.k}</span><div style="font-size:24px">${s.i}</div><b>${s.t}</b><div style="font-size:11px">${s.s}</div>`;
    c.onclick=()=>{
      selecionado=s;
      document.querySelectorAll(".card").forEach(b=>b.classList.remove("selected"));
      c.classList.add("selected");
      document.getElementById("cta").disabled=false;
    };
    grid.appendChild(c);
  });
}

function abrirZap(msg){window.open("https://wa.me/"+WHATSAPP+"?text="+encodeURIComponent(msg),"_blank")}

function chamar(){
  if(!selecionado) return;
  let id="atendimento-"+Date.now();
  let agora=new Date();
  let lista=getAtend();
  lista.unshift({id,nome:"Cliente Início",servico:selecionado.t,data:agora.toLocaleDateString("pt-BR"),horario:agora.toLocaleTimeString("pt-BR"),status:"pendente",quando:agora.toISOString()});
  saveAtend(lista);
  let msg=`❄️ *NOSSO FRIO - Mossoró/RN* ❄️

Olá! Preciso de atendimento.

🛠️ Serviço: ${selecionado.t}
📋 Protocolo: ${id}
📍 Mossoró - RN
🕒 ${agora.toLocaleDateString("pt-BR")} ${agora.toLocaleTimeString("pt-BR")}

Meu ar está com problema de ${selecionado.t.toLowerCase()}. Pode me informar valores?

Obrigado! 🙏`;
  abrirZap(msg);
}

function mostrarPainel(nome){
  if(nome==="admin"){
    let s=prompt("Digite a senha do Admin:");
    if(s!==SENHA){alert("Senha incorreta! Senha é 1234");return}
    renderAdmin();
  }
  document.querySelectorAll(".panel").forEach(p=>p.classList.toggle("active",p.id===nome));
  document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("active",b.dataset.tab===nome));
}

document.querySelectorAll(".tab").forEach(b=>b.addEventListener("click",()=>mostrarPainel(b.dataset.tab)));

document.getElementById("formAgendamento").addEventListener("submit",e=>{
  e.preventDefault();
  let nome=document.getElementById("nome").value;
  let tel=document.getElementById("telefone").value;
  let serv=document.getElementById("servico").value;
  let data=document.getElementById("data").value;
  let end=document.getElementById("endereco").value;
  let id="atendimento-"+Date.now();
  let agora=new Date();
  let lista=getAtend();
  lista.unshift({id,nome,telefone:tel,endereco:end,enderecoCompleto:end,servico:serv,data,horario:agora.toLocaleTimeString("pt-BR"),status:"pendente",quando:agora.toISOString()});
  saveAtend(lista);
  let msg=`📅 *AGENDAMENTO - NOSSO FRIO*

👤 Nome: ${nome}
📞 Tel: ${tel}
📍 End: ${end}
🔧 Serviço: ${serv}
📆 Data: ${data}
📋 Protocolo: ${id}

Confirma disponibilidade?`;
  abrirZap(msg);
});

function cadastrarTecnico(){
  let nome=document.getElementById("tecNome").value;
  let empresa=document.getElementById("tecEmpresa").value;
  let tel=document.getElementById("tecTelefone").value;
  let cep=document.getElementById("tecCep").value;
  let rua=document.getElementById("tecRua").value;
  let numero=document.getElementById("tecNumero").value;
  let bairro=document.getElementById("tecBairro").value;
  let cidade=document.getElementById("tecCidade").value;
  let serv=document.getElementById("tecServico").value;
  let valor=document.getElementById("tecValor").value;
  let feito=document.getElementById("tecFeito").value;
  if(!nome||!rua||!numero){alert("Preencha Nome, Rua e Número");return}
  let completo=`${rua}, ${numero}, ${bairro}, ${cidade}, ${cep}`;
  let id="atendimento-"+Date.now();
  let agora=new Date();
  let lista=getAtend();
  lista.unshift({id,nome,empresa,telefone:tel,cep,rua,numero,bairro,cidade,enderecoCompleto:completo,servico:serv,valor:valor||0,feito:feito||"",data:agora.toLocaleDateString("pt-BR"),horario:agora.toLocaleTimeString("pt-BR"),status:"pendente",quando:agora.toISOString()});
  saveAtend(lista);
  renderAdmin();
  alert("✅ Cadastrado no Admin!\n"+completo);
}

function exportarCSV(){
  let d=getAtend();
  if(!d.length){alert("Nada");return}
  let csv="Data,Nome,Telefone,CEP,Rua,Numero,Bairro,EnderecoCompleto,Servico,Status,Valor\n";
  d.forEach(a=>{csv+=`${a.data||""},${a.nome||""},${a.telefone||""},${a.cep||""},${a.rua||""},${a.numero||""},${a.bairro||""},${(a.enderecoCompleto||"").replace(/,/g," ")},${a.servico||""},${a.status||""},${a.valor||0}\n`});
  let blob=new Blob([csv],{type:"text/csv"});
  let url=URL.createObjectURL(blob);
  let a2=document.createElement("a");a2.href=url;a2.download="nosso-frio.csv";a2.click();
}
function limparAntigos(){if(!confirm("Limpar?"))return;localStorage.setItem("nf_atend",JSON.stringify([]));renderAdmin()}

criarCartoes();
let mapa=L.map("map").setView([-5.1875,-37.3442],13);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19}).addTo(mapa);
L.marker([-5.1875,-37.3442]).addTo(mapa).bindPopup("NOSSO FRIO");
renderAdmin();
</script>
</body>
</html>
